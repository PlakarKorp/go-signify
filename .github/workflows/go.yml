name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
      # The kortex coverage upload authenticates with the job's OIDC token.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

      - name: Install go-junit-report
        run: go install github.com/jstemmer/go-junit-report/v2@latest

      # One run produces both a coverage profile and a JUnit XML.
      # continue-on-error keeps the upload steps reachable when tests fail, which
      # is when the results matter most; the last step re-surfaces the failure.
      - name: Test
        id: gotest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          go test -v -race -coverprofile=coverage.out -covermode=atomic -json ./... \
            | go-junit-report -parser gojson -set-exit-code > junit.xml
          status=$?
          echo "test_exit=$status" >> "$GITHUB_OUTPUT"
          exit $status

      # Uploaded from one leg only: three matrix legs reporting the same lines
      # would add nothing to the coverage report.
      # kortex gets the same reports, sent by the uploader it serves (a public
      # repository cannot use its action) with the job's OIDC token: no secret.
      # A pull request from a fork gets no token and uploads nothing. Failing
      # here is a warning, never a failed build.
      - name: Upload coverage and test results to kortex
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: |
          if ! curl -fsSL --retry 3 https://kortex.plakar.io/dl/kortex-linux-amd64 -o "$RUNNER_TEMP/kortex"; then
            echo "::warning title=kortex coverage upload::could not fetch the uploader"
            exit 0
          fi
          chmod +x "$RUNNER_TEMP/kortex"
          "$RUNNER_TEMP/kortex" coverage upload --url https://kortex.plakar.io coverage.out junit.xml

      # Surface a genuine test failure now that the results have been uploaded.
      - name: Fail if tests failed
        if: ${{ !cancelled() && steps.gotest.outputs.test_exit != '0' }}
        run: exit 1
